<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>Noder · Birdland</title>
  <link rel="stylesheet" href="styles.css?v=20261127-compact">
  <script type="module" src="viewer.js?v=20261127-compact"></script>
</head>
<body>
  <header class="toolbar">
    <strong id="title">Noder</strong>
    <nav aria-label="Bladring i noder">
      <button id="previous" type="button" disabled aria-label="Forrige sider">←</button>
      <label class="page-control">Side <input id="page" type="number" min="1" value="1" aria-label="Gå til side" disabled><span id="total">/ …</span></label>
      <button id="next" type="button" disabled aria-label="Næste sider">→</button>
    </nav>
    <label class="spread-control"><span class="visually-hidden">Antal sider ad gangen</span><select id="spread" aria-label="Antal sider ad gangen"><option value="2" selected>To sider</option><option value="1">Én side</option></select></label>
    <button id="fullscreen" type="button">Fuldskærm</button>
    <a id="original" target="_blank" rel="noopener" hidden>Åbn PDF / udskriv</a>
  </header>
  <p id="status" role="status" aria-live="polite">Gør noder klar …</p>
  <main id="pages" class="spread-two" aria-label="Nodesider" aria-busy="true"></main>
  <noscript>Nodeviseren kræver JavaScript. Åbn PDF-filen direkte for at læse noderne.</noscript>
</body>
</html>
