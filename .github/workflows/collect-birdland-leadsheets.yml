name: Collect free Birdland lead-sheet sources
on:
  push:
    branches: ['research/birdland-sources']
    paths: ['scripts/collect_birdland_leadsheets.py', '.github/workflows/collect-birdland-leadsheets.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: collect-birdland-leadsheets, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect free editable sources and inspect their structure
        run: python scripts/collect_birdland_leadsheets.py
      - name: Preserve originals and coverage separately from active scores
        run: |
          python -c 'from pathlib import Path; p=Path("research/birdland/bulk"); size=sum(f.stat().st_size for f in p.rglob("*") if f.is_file()); assert size<20000000,size; print("Source bytes:",size)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/birdland/bulk
          if ! git diff --cached --quiet; then
            git commit -m 'research(birdland): retain free MuseScore and ABC lead-sheet originals'
            git push origin HEAD:${{ github.ref_name }}
          fi
