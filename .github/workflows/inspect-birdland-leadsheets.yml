name: Inspect more Birdland lead-sheet sources
on:
  push:
    branches: [main]
    paths: ['scripts/inspect_birdland_leadsheets.py', '.github/workflows/inspect-birdland-leadsheets.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: inspect-birdland-leadsheets, cancel-in-progress: false}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: research/birdland-sources
          path: .free-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.6
      - name: Prepare existing PDF headers and editable native sources for review
        run: python scripts/inspect_birdland_leadsheets.py .free-source
      - name: Keep review material away from the published wikis
        working-directory: .free-source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/birdland/bulk/inspection.json 'research/birdland/bulk/sources/*.mscx'
          if ! git diff --cached --quiet; then
            git commit -m 'research(birdland): inspect editable leadsheets against original chart headers'
            git push origin HEAD:research/birdland-sources
          fi
