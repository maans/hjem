name: Publish Birdland dated folders and reviewed leadsheets
on:
  push:
    branches: [main]
    paths: ['scripts/publish_birdland_library.py', 'scripts/birdland-setlists.json', 'scripts/birdland-arrangement-settings.json', 'scripts/convert_birdland_leadsheets.mjs', 'scripts/extend_birdland_leadsheets.mjs', 'scripts/test_repertoire_navigation_browser.mjs']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: sync-repertoire-plugin-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/checkout@v4
        with:
          repository: maans/huwiki-forge
          ref: 091efb2d435f4ce7e6b27176b8b63c009e45187b
          path: .forge-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install MusicXML parser
        run: npm install --prefix /tmp/birdland-dom --no-save --no-package-lock @xmldom/xmldom@0.8.11
      - name: Verify musical conversion
        env:
          DOM_MODULE: /tmp/birdland-dom/node_modules/@xmldom/xmldom
          CONVERTER_PATH: ${{ github.workspace }}/.forge-source/plugins/musescore-import/src/converter.js
        run: node --test scripts/test_convert_birdland_leadsheets.mjs
      - name: Retrieve reviewed original MusicXML bytes and convert to Birdland keys and tempi
        run: |
          python scripts/research_birdland_sources.py --skip-archive
          node scripts/convert_birdland_leadsheets.mjs --references scripts/birdland-arrangement-settings.json --converter .forge-source/plugins/musescore-import/src/converter.js --dom-module /tmp/birdland-dom/node_modules/@xmldom/xmldom
          python -c 'import json; r=json.load(open("research/birdland/conversion.json")); assert r["converted"]==5,r["converted"]'
      - name: Convert and audition additional free MuseScore and ABC melodies
        env:
          FORGE_SOURCE: ${{ github.workspace }}/.forge-source
          DOM_MODULE: /tmp/birdland-dom/node_modules/@xmldom/xmldom
        run: |
          node --test scripts/test_birdland_leadsheet_fallback.mjs
          node scripts/extend_birdland_leadsheets.mjs --forge .forge-source --dom-module /tmp/birdland-dom/node_modules/@xmldom/xmldom
          python -c 'import json; r=json.load(open("research/birdland/bulk-conversion.json")); assert r["converted"]>=34,r["converted"]'
          node scripts/test_birdland_leadsheet_playback.mjs
      - name: Update shared Repertoire without changing original notes
        run: |
          python scripts/update_abc_plugin.py --title '$:/plugins/huwiki/repertoire' --plugin .forge-source/plugins/repertoire/dist/plugin.json wiki/birdland/index.html wiki/birdland/guitar/index.html wiki/bjarke/index.html wiki/silba/index.html wiki/akustisk/index.html wiki/fest/index.html wiki/index.html
      - name: Create dated folders and link reviewed notation variants
        run: |
          python scripts/publish_birdland_library.py
          python - <<'PY'
          import hashlib,pathlib,subprocess,sys
          paths=[pathlib.Path(p) for p in ['wiki/birdland/index.html','wiki/birdland/guitar/index.html']]
          before=[hashlib.sha256(p.read_bytes()).hexdigest() for p in paths]
          subprocess.run([sys.executable,'scripts/publish_birdland_library.py'],check=True)
          assert before==[hashlib.sha256(p.read_bytes()).hexdigest() for p in paths], 'Publication must be idempotent'
          PY
      - name: Install browser acceptance runner
        run: npm install --prefix /tmp/repertoire-browser --no-save --no-package-lock playwright-core@1.56.1
      - name: Verify navigation and controls against all actual Birdland leadsheets
        env:
          PLAYWRIGHT_MODULE: /tmp/repertoire-browser/node_modules/playwright-core/index.mjs
        run: node scripts/test_repertoire_navigation_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repertoire-navigation-review
          path: /tmp/repertoire-navigation-artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish validated library
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- wiki research/birdland
          if ! git diff --cached --quiet; then
            git commit -m 'feat(birdland): publish reviewed melody leadsheets with jazz accompaniment'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
