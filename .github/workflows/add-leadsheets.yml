name: Add reviewed Helles ABC leadsheets
on:
  push:
    branches: [main]
    paths:
      - 'research/helles/leadsheet-additions.json'
      - 'research/helles/material-additions.json'
      - 'scripts/apply_leadsheet_additions.py'
      - '.github/workflows/add-leadsheets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-shared-musician-plugins-main
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_leadsheet_additions.py
      - name: Publish reviewed additions
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki/helles/index.html research/helles/tiddlers.json
          if ! git diff --cached --quiet; then
            git commit -m 'Merge reviewed Helles scores and chord charts, retaining original materials'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
