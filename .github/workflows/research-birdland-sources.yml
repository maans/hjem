name: Research Birdland editable score sources
on:
  push:
    branches: ['research/birdland-sources']
    paths: ['scripts/research_birdland_sources.py', 'scripts/test_research_birdland_sources.py', 'scripts/birdland-research-titles.json', '.github/workflows/research-birdland-sources.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-birdland-sources
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser and matching
        run: python -m unittest discover -s scripts -p 'test_research_birdland_sources.py' -v
      - name: Download and validate sources from reviewed public catalogues
        run: python scripts/research_birdland_sources.py
      - name: Retain inspected sources and research status
        run: |
          python -c 'from pathlib import Path; p=list(Path("research/birdland").rglob("*")); size=sum(x.stat().st_size for x in p if x.is_file()); assert size < 20000000, size; print("Research bytes:",size)'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- research/birdland
          if ! git diff --cached --quiet; then
            git commit -m 'research(birdland): retain validated alternative lead sheets and coverage'
            git push origin HEAD:${{ github.ref_name }}
          fi
