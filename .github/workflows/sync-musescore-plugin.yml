name: Synchronize shared MuseScore, ABC and Repertoire plugins
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-musescore-plugin.yml'
      - 'scripts/update_abc_plugin.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-shared-musician-plugins-main
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORGE_REF: 17ecc50f1b417a358becca48e4bc471409c535b2
      ABC_VERSION: '0.3.77'
      REPERTOIRE_VERSION: '0.3.18'
      PRINT_VERSION: '0.2.13-test.1'
      MUSESCORE_VERSION: '0.1.12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: maans/huwiki-forge
          ref: 17ecc50f1b417a358becca48e4bc471409c535b2
          path: .forge-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build both matching plugins from the pinned source release
        run: |
          node .forge-source/scripts/build-abc-ui.mjs
          node .forge-source/scripts/build-repertoire-plugin.mjs
          node .forge-source/scripts/build-print-article.mjs
          node .forge-source/scripts/build-musescore-import.mjs
      - name: Download and verify the matching shared plugin releases
        run: |
          python - <<'PY'
          import json, os, pathlib, re, urllib.request
          ref = os.environ['FORGE_REF']
          if not re.fullmatch(r'[0-9a-f]{40}', ref):
              raise SystemExit('The Forge release must be pinned to a full commit SHA')
          for name in ('abc', 'repertoire', 'musescore-import', 'print-article'):
              data = pathlib.Path(f'.forge-source/plugins/{name}/dist/plugin.json').read_bytes()
              plugin = json.loads(data)
              if plugin.get('title') != f'$:/plugins/huwiki/{name}' or plugin.get('version') != os.environ[{'abc':'ABC_VERSION','repertoire':'REPERTOIRE_VERSION','musescore-import':'MUSESCORE_VERSION','print-article':'PRINT_VERSION'}[name]]:
                  raise SystemExit(f'The pinned {name} plugin does not match the requested release')
              bundled = json.loads(plugin['text'])['tiddlers']
              if name == 'abc' and '$:/plugins/huwiki/abc/fullscreen.js' not in bundled:
                  raise SystemExit('The shared fullscreen controller is missing from ABC')
              pathlib.Path(f'/tmp/{name}-release.json').write_bytes(data)
          PY
      - name: Update both plugins together and verify every wiki
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, subprocess, sys
          spec = importlib.util.spec_from_file_location('updater', 'scripts/update_abc_plugin.py')
          updater = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(updater)
          files = sorted(pathlib.Path('wiki').rglob('index.html'))
          if not files:
              raise SystemExit('No musician wiki files were found')
          releases = {name: json.loads(pathlib.Path(f'/tmp/{name}-release.json').read_bytes()) for name in ('abc', 'repertoire', 'musescore-import', 'print-article')}
          expected = {}
          for path in files:
              original = path.read_bytes().decode('utf-8')
              updated, abc_status = updater.replace_plugin(original, releases['abc'], '$:/plugins/huwiki/abc')
              updated, repertoire_status = updater.replace_plugin(updated, releases['repertoire'], '$:/plugins/huwiki/repertoire')
              updated, importer_status = updater.replace_plugin(updated, releases['musescore-import'], '$:/plugins/huwiki/musescore-import')
              if repertoire_status != 'absent' and abc_status == 'absent':
                  raise SystemExit(f'{path}: Repertoire requires the matching ABC plugin')
              updated, publisher_status = updater.replace_plugin(updated, releases['print-article'], '$:/plugins/huwiki/print-article')
              expected[path] = updated.encode('utf-8')
          for name, plugin in releases.items():
              subprocess.run([sys.executable, 'scripts/update_abc_plugin.py', '--title', plugin['title'], '--plugin', f'/tmp/{name}-release.json', *map(str, files)], check=True)
          for path in files:
              if path.read_bytes() != expected[path]:
                  raise SystemExit(f'{path}: plugin update changed unexpected wiki content')
              for plugin in releases.values():
                  _, status = updater.replace_plugin(path.read_bytes().decode('utf-8'), plugin, plugin['title'])
                  if status not in ('current', 'absent'):
                      raise SystemExit(f'{path}: the requested plugin was not installed')
          print(f'Verified both releases in {len(files)} wikis; all other wiki content is unchanged')
          PY
      - name: Merge reviewed leadsheets and compact existing imported chord names
        run: |
          python scripts/apply_leadsheet_additions.py
          python scripts/apply_repertoire_videos.py
          python scripts/apply_silba_birthday.py
      - name: Verify existing notation in every set and full repertoire
        run: node scripts/check_repertoire_views.mjs
      - name: Publish the updated musician wikis
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'wiki/**/index.html' research/helles/tiddlers.json
          if ! git diff --cached --quiet; then
            git commit -m "build(wiki): synchronize ABC ${ABC_VERSION} and Repertoire ${REPERTOIRE_VERSION}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
