name: Synchronize instrument-aware importer and Bjarke score
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-musescore-plugin.yml'
      - 'scripts/fix_bjarke_score.py'
      - 'scripts/scores/alone-together.abc'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-musescore-plugin-main
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORGE_REF: b08d34c57507f0e6400ae35106668196340b32e7
      IMPORT_VERSION: '0.1.10'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the verified importer release
        run: |
          python - <<'PY'
          import json, os, pathlib, re, urllib.request
          ref = os.environ['FORGE_REF']
          if not re.fullmatch(r'[0-9a-f]{40}', ref):
              raise SystemExit('The release must be pinned to a full commit SHA')
          url = f'https://raw.githubusercontent.com/maans/huwiki-forge/{ref}/plugins/musescore-import/dist/plugin.json'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          plugin = json.loads(data)
          if plugin.get('title') != '$:/plugins/huwiki/musescore-import' or plugin.get('version') != os.environ['IMPORT_VERSION']:
              raise SystemExit('The pinned importer does not match the requested release')
          pathlib.Path('/tmp/musescore-release.json').write_bytes(data)
          PY
      - name: Update the importer in existing musician wikis
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          files = sorted(str(path) for path in pathlib.Path('wiki').rglob('index.html'))
          if not files:
              raise SystemExit('No musician wiki files were found')
          subprocess.run([sys.executable, 'scripts/update_abc_plugin.py', '--title', '$:/plugins/huwiki/musescore-import', '--plugin', '/tmp/musescore-release.json', *files], check=True)
          PY
      - name: Apply the checked Alone Together repair
        run: python scripts/fix_bjarke_score.py
      - name: Publish the updated musician wikis
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'wiki/**/index.html'
          if ! git diff --cached --quiet; then
            git commit -m 'build(wiki): synchronize importer 0.1.10 and repair Alone Together'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
